<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A1823">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>한반도 대전략</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Mobile-first game shell: full-bleed map, floating HUD, icon dock, slide-up sheets.
     One committed dark palette (sea-chart navy + map-paper ink + signal amber). */
  :root {
    color-scheme: dark;
    --sea-deep: #0A1823;
    --panel: #0E1D28;
    --panel-2: #132736;
    --panel-3: #1A3244;
    --glass: rgba(11, 24, 34, .86);
    --line: #243D50;
    --line-soft: #1B3141;
    --ink: #E8E2D2;
    --ink-2: #C3C8C4;
    --muted: #8A9CA6;
    --accent: #F2B544;
    --accent-ink: #231703;
    --danger: #E35D51;
    --ok: #72C282;
    --warn: #E9A23B;
    --ally: #7FA8F0;
    --dock-h: 62px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --f-display: 'Black Han Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --f-body: 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--sea-deep); color: var(--ink); font: 14px/1.5 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  input, textarea { user-select: text; -webkit-user-select: text; }
  button, input, select { font: inherit; color: inherit; }
  button { touch-action: manipulation; }
  #app { position: relative; height: 100%; overflow: hidden; }
  #mapwrap { position: absolute; inset: 0; touch-action: none; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- HUD (top) ---------- */
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: calc(8px + var(--safe-t)) 12px 18px; display: flex; align-items: flex-start; gap: 8px; z-index: 5;
    background: linear-gradient(to bottom, rgba(8,18,26,.92) 0%, rgba(8,18,26,.7) 65%, rgba(8,18,26,0) 100%); pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #leader { display: flex; align-items: center; gap: 8px; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 5px 10px 5px 6px; cursor: pointer; text-align: left; flex: none; max-width: 46vw; }
  #leader .flag { width: 30px; height: 30px; border-radius: 9px; box-shadow: 0 0 0 2px rgba(0,0,0,.35) inset; flex: none; display: grid; place-items: center; font: 13px var(--f-display); color: rgba(0,0,0,.7); }
  #leader b { font: 15px/1.1 var(--f-display); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #leader small { font: 11px var(--f-mono); color: var(--muted); display: block; white-space: nowrap; }
  #res { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; padding-bottom: 2px; }
  #res::-webkit-scrollbar { display: none; }
  .pillr { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 4px 9px; flex: none; cursor: pointer; min-height: 40px; }
  .pillr svg.ic { width: 17px; height: 17px; color: var(--muted); }
  .pillr .vv { display: grid; line-height: 1.1; }
  .pillr .v { font: 600 14px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pillr .k { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .pillr.warn { border-color: var(--danger); }
  .iconbtn { width: 42px; height: 42px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; flex: none; }
  .d { font: 10.5px var(--f-mono); margin-left: 3px; }
  .pos { color: var(--ok); } .neg { color: var(--danger); } .mut { color: var(--muted); }

  /* ---------- map tools ---------- */
  #tools { position: absolute; right: 10px; top: calc(84px + var(--safe-t)); display: grid; gap: 6px; z-index: 4; }
  #tools .iconbtn { width: 40px; height: 40px; font: 700 18px var(--f-mono); }
  #modebar { position: absolute; top: calc(70px + var(--safe-t)); left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 12px; font-weight: 700; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.45); max-width: calc(100% - 32px); z-index: 6; font-size: 13px; }
  #modebar button { background: rgba(0,0,0,.18); border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 700; }
  #modebar.nuke { background: #C6F04A; color: #1B2403; }
  #toasts { position: absolute; top: calc(70px + var(--safe-t)); left: 12px; right: 60px; display: grid; gap: 6px; justify-items: start; pointer-events: none; z-index: 7; }
  .toast { background: rgba(14,29,40,.96); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 10px; font-size: 13px; max-width: 420px; animation: tin .22s ease-out; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
  .toast.bad { border-left-color: var(--danger); } .toast.good { border-left-color: var(--ok); }
  @keyframes tin { from { transform: translateY(-8px); opacity: 0; } }
  #tip { position: absolute; pointer-events: none; background: rgba(9,20,28,.96); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; font-size: 13px; max-width: 280px; box-shadow: 0 10px 28px rgba(0,0,0,.5); z-index: 8; }
  #tip .row { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 12px; }

  /* ---------- context card (selection) ---------- */
  #ctx { position: absolute; left: 10px; right: 10px; bottom: calc(var(--dock-h) + var(--safe-b) + 74px); max-width: 540px; margin: 0 auto; background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 9px; z-index: 5; box-shadow: 0 16px 40px rgba(0,0,0,.45); animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(14px); opacity: 0; } }
  #ctx .ch { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #ctx .ch > svg, #ctx .ch > .chip, #ctx .ch > .x { flex-shrink: 0; }
  #ctx .ch .t { flex: 1; min-width: 0; }
  #ctx .ch b { font: 18px/1.15 var(--f-display); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ctx .ch small { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ctx .x { width: 34px; height: 34px; border-radius: 10px; border: 0; background: rgba(255,255,255,.06); cursor: pointer; display: grid; place-items: center; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chipk { font: 12px var(--f-mono); background: var(--panel-2); border-radius: 8px; padding: 3px 8px; white-space: nowrap; }
  .chipk b { font-weight: 600; color: var(--ink); }
  .acts { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .acts::-webkit-scrollbar { display: none; }
  .act { flex: none; display: grid; justify-items: center; gap: 3px; min-width: 70px; padding: 8px 8px 7px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; font-size: 12px; font-weight: 500; line-height: 1.15; text-align: center; }
  .act svg.ic { width: 22px; height: 22px; }
  .act.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .act.danger { border-color: #7A3530; color: #FFB3AA; }
  .act:disabled { opacity: .4; }
  .act small { font: 10.5px var(--f-mono); opacity: .8; }
  .preview { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preview > div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
  .preview .k { font-size: 11px; color: var(--muted); }
  .preview .v { font: 700 20px var(--f-mono); }

  /* ---------- floating buttons ---------- */
  #fabs { position: absolute; right: 12px; left: 12px; bottom: calc(var(--dock-h) + var(--safe-b) + 12px); display: flex; justify-content: flex-end; align-items: center; gap: 10px; z-index: 5; pointer-events: none; }
  #fabs > * { pointer-events: auto; }
  #btn-next { position: relative; height: 52px; padding: 0 16px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
  #btn-next .badge { position: absolute; top: -6px; right: -6px; }
  #btn-end { height: 56px; padding: 0 22px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); border: 0; font: 19px var(--f-display); letter-spacing: .02em; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 28px rgba(242,181,68,.28), 0 4px 12px rgba(0,0,0,.4); }
  #btn-end small { font: 600 11px var(--f-mono); opacity: .75; display: block; text-align: left; }
  #btn-end:disabled { opacity: .5; }
  .badge { font: 700 11px var(--f-mono); background: var(--danger); color: #fff; border-radius: 10px; padding: 1px 6px; min-width: 18px; text-align: center; }

  /* ---------- dock ---------- */
  #dock { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--dock-h) + var(--safe-b)); padding-bottom: var(--safe-b); display: grid; grid-template-columns: repeat(6, 1fr); background: rgba(9,20,28,.97); border-top: 1px solid var(--line); z-index: 9; }
  .dk { position: relative; background: none; border: 0; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 11.5px; font-weight: 500; cursor: pointer; }
  .dk[aria-pressed="true"] { color: var(--accent); }
  .dk[aria-pressed="true"]::before { content: ''; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
  .dk .badge { position: absolute; top: 6px; left: calc(50% + 6px); }

  /* ---------- sheet ---------- */
  #sheet { position: absolute; left: 0; right: 0; bottom: calc(var(--dock-h) + var(--safe-b)); max-height: calc(78% - var(--dock-h)); height: calc(72% - var(--dock-h)); background: var(--panel); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; z-index: 8;
    display: grid; grid-template-rows: auto auto 1fr; box-shadow: 0 -18px 40px rgba(0,0,0,.45); animation: sheetin .24s cubic-bezier(.2,.8,.2,1); }
  #sheet.full { height: calc(100% - var(--dock-h) - var(--safe-b) - var(--safe-t) - 8px); max-height: none; }
  @keyframes sheetin { from { transform: translateY(40px); opacity: 0; } }
  .grab { height: 22px; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .grab i { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
  #sheet header { display: flex; align-items: center; gap: 10px; padding: 0 16px 10px; border-bottom: 1px solid var(--line-soft); }
  #sheet header h2 { flex: 1; }
  #sheet-body { overflow-y: auto; padding: 14px 16px 28px; display: grid; gap: 16px; align-content: start; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* ---------- turn splash ---------- */
  #splash { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4,10,15,.55); z-index: 15; pointer-events: none; }
  #splash .box { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 22px 28px; display: grid; gap: 10px; min-width: 260px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #splash .date { font: clamp(30px, 8vw, 44px)/1 var(--f-display); }
  #splash .what { color: var(--ink-2); font-size: 13px; }
  #splash .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #splash .bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

  /* ---------- buttons ---------- */
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; line-height: 1.3; min-height: 38px; transition: background .12s, transform .08s; }
  .btn:active:not(:disabled), .act:active:not(:disabled), .dk:active, #btn-end:active:not(:disabled), .pillr:active, .iconbtn:active { transform: scale(.96); }
  .btn:hover:not(:disabled) { background: var(--panel-3); }
  .btn:focus-visible, .dk:focus-visible, .act:focus-visible, input:focus-visible, .iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .42; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btn.danger { border-color: #7A3530; color: #FFB3AA; }
  .btn.sm { padding: 6px 11px; font-size: 13px; min-height: 36px; }
  .btn.big { padding: 13px 22px; font-size: 16px; min-height: 50px; border-radius: 14px; }
  .chip { width: 14px; height: 14px; border-radius: 4px; box-shadow: 0 0 0 2px rgba(0,0,0,.35) inset; flex: none; display: inline-block; }

  /* ---------- sheet content ---------- */
  h2 { font: 22px/1.15 var(--f-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
  h3 { font-size: 11.5px; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
  .sec { display: grid; gap: 8px; }
  .sec + .sec { border-top: 1px solid var(--line-soft); padding-top: 14px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .kv > div { background: var(--panel-2); border-radius: 6px; padding: 6px 8px; }
  .kv .k { font-size: 11px; color: var(--muted); }
  .kv .v { font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; }
  .hp { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .hp i { display: block; height: 100%; border-radius: 3px; }
  .rows { display: grid; gap: 4px; }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
  .pill.war { color: var(--danger); } .pill.ally { color: var(--ally); } .pill.peace { color: var(--muted); } .pill.truce { color: var(--warn); } .pill.gone { color: #6B7A82; }
  .unit-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .ubtn { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; text-align: left; padding: 6px 8px; }
  .ubtn .nm { font-size: 12.5px; font-weight: 500; display: block; line-height: 1.25; }
  .ubtn .cs { font: 11px var(--f-mono); color: var(--muted); display: block; }
  .ubtn .why { font-size: 10.5px; color: var(--warn); display: block; }
  .list-unit { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; background: var(--panel-2); }
  .list-unit .grow { flex: 1; min-width: 0; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .nation-row { display: grid; gap: 7px; padding: 10px; background: var(--panel-2); border-radius: 8px; }
  .nation-row .head { display: flex; align-items: center; gap: 8px; }
  .nation-row .head b { font: 17px var(--f-display); }
  .relbar { position: relative; height: 6px; background: var(--line); border-radius: 3px; }
  .relbar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .relbar::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
  .tech { display: grid; gap: 4px; padding: 8px 10px; border-radius: 6px; background: var(--panel-2); border: 1px solid transparent; }
  .tech.on { border-color: var(--accent); }
  .tech.done { opacity: .6; }
  .tech .row b { font-weight: 700; font-size: 13px; }
  .log { display: grid; gap: 3px; font-size: 12.5px; }
  .log div { padding: 3px 0 3px 8px; border-left: 2px solid var(--line); }
  .log .lg-capture { border-left-color: var(--accent); } .log .lg-war, .log .lg-loss { border-left-color: var(--danger); }
  .log .lg-peace, .log .lg-tech { border-left-color: var(--ok); } .log .lg-missile { border-left-color: #FF8A5B; } .log .lg-capitulate { border-left-color: #fff; font-weight: 700; }
  table.stats { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.stats th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11px; padding: 4px; }
  table.stats th:first-child, table.stats td:first-child { text-align: left; }
  table.stats td { text-align: right; padding: 5px 4px; border-top: 1px solid var(--line-soft); font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  table.stats td:first-child { font-family: var(--f-body); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  /* ---------- v2: politics, arms, world ---------- */
  .eyebrow.nuke { color: #FF8A5B !important; }
  .spec { margin: 0; font: 12px/1.5 var(--f-mono); color: var(--ink-2); background: var(--panel-2); border-left: 2px solid var(--line); padding: 6px 8px; border-radius: 0 4px 4px 0; }
  .fac { display: grid; gap: 3px; }
  .decrees, .designs { display: grid; gap: 6px; }
  .decree, .missile, .design, .op { display: grid; gap: 4px; padding: 8px 10px; border-radius: 6px; background: var(--panel-2); }
  .decree.off, .design.off { opacity: .62; }
  .decree .row b, .missile .row b { font-size: 13px; }
  .mspec { font: 11.5px var(--f-mono); color: var(--accent); }
  .doom { display: flex; align-items: baseline; gap: 8px; }
  .doom .num { font: 700 34px var(--f-mono); color: var(--danger); }
  .nat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .natpick { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 13px; text-align: left; }
  .natpick[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .nat-detail { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
  .nat-detail b { font: 18px var(--f-display); }
  .nat-detail p { font-size: 13px; }
  .traits { display: flex; flex-wrap: wrap; gap: 6px; }
  .trait { font-size: 11.5px; border: 1px solid var(--accent); color: var(--accent); border-radius: 10px; padding: 1px 8px; }
  input[type=text], input[type=search], select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
  #dip-search { width: 100%; }
  label { display: inline-flex; gap: 8px; align-items: center; }
  .log .lg-nuke { border-left-color: #C6F04A; font-weight: 700; } .log .lg-decree { border-left-color: var(--ally); } .log .lg-intel { border-left-color: #B08CF0; } .log .lg-move { opacity: .75; }

  /* ---------- v3: cabinet, report, trends ---------- */
  .ministers { display: grid; gap: 6px; }
  .minister { display: grid; gap: 5px; padding: 8px 10px; border-radius: 6px; background: var(--panel-2); border: 1px solid transparent; }
  .minister.plot { border-color: var(--danger); }
  .minister.vacant { opacity: .75; border-style: dashed; border-color: var(--line); }
  .minister b { font-size: 14px; }
  .mtrait { font-size: 11px; border: 1px solid var(--ally); color: var(--ally); border-radius: 9px; padding: 0 6px; margin-left: 4px; white-space: nowrap; }
  .skill { color: var(--accent); letter-spacing: 1px; font-size: 12px; }
  .mbars { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 8px; align-items: center; }
  .report { display: grid; gap: 10px; }
  .sparks { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .spark-fig { margin: 0; display: grid; gap: 2px; }
  .spark-fig figcaption { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .spark-fig figcaption .num { color: var(--ink); font-weight: 600; }
  svg.spark { width: 100%; height: auto; display: block; touch-action: none; }
  svg.spark .grid { stroke: var(--line-soft); stroke-width: 1; }
  svg.spark .ax { fill: var(--muted); font: 9px var(--f-mono); }
  svg.spark .area { fill: var(--accent); fill-opacity: .12; stroke: none; }
  svg.spark .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg.spark .end { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
  svg.spark .cross { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
  svg.spark .tipt { fill: var(--ink); font: 600 10px var(--f-mono); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
  details summary { cursor: pointer; }
  /* ---------- dialogs ---------- */
  #modal { position: fixed; inset: 0; background: rgba(4,10,15,.72); display: grid; place-items: center; padding: 16px; z-index: 20; overflow-y: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; width: min(560px, 100%); padding: 22px; display: grid; gap: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.5); max-height: calc(100% - 16px); overflow-y: auto; animation: up .22s ease-out; }
  .card.wide { width: min(900px, 100%); }
  .card p { margin: 0; color: var(--ink-2); }
  .choices { display: grid; gap: 8px; }
  .choices .btn { min-height: 50px; font-size: 15px; border-radius: 14px; text-align: left; padding: 12px 16px; }
  .title-block { display: grid; gap: 6px; }
  .title-block .eyebrow { font: 12px var(--f-mono); color: var(--accent); letter-spacing: .14em; }
  .title-block h1 { font: clamp(36px, 9vw, 60px)/1 var(--f-display); margin: 0; letter-spacing: -.01em; }
  .help { display: grid; gap: 10px; font-size: 14px; color: var(--ink-2); max-width: 70ch; }
  .help b { color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { background: var(--panel-2); border: 0; padding: 8px 14px; cursor: pointer; min-height: 40px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .opts { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

  /* ---------- start screens ---------- */
  .card.screen { width: min(760px, 100%); min-height: min(720px, 100%); align-content: start; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper .dots { display: flex; gap: 6px; flex: 1; }
  .stepper .dots i { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
  .stepper .dots i.on { background: var(--accent); }
  .scen-list { display: grid; gap: 10px; }
  .scen { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; cursor: pointer; display: grid; gap: 6px; }
  .scen b { font: 20px var(--f-display); }
  .scen span { font-size: 13.5px; color: var(--ink-2); }
  .scen .meta { font: 11.5px var(--f-mono); color: var(--accent); }
  .nat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .natpick { display: grid; gap: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; text-align: left; min-height: 64px; }
  .natpick .chip { width: 22px; height: 22px; border-radius: 6px; }
  .natpick b { font: 15px var(--f-display); }
  .natpick small { font-size: 10.5px; color: var(--muted); }
  .natpick[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .nat-detail { background: var(--panel-2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
  .nat-detail b { font: 20px var(--f-display); }
  .nat-detail p { font-size: 13.5px; }
  .traits { display: flex; flex-wrap: wrap; gap: 6px; }
  .trait { font-size: 12px; border: 1px solid var(--accent); color: var(--accent); border-radius: 10px; padding: 2px 9px; }
  .titles { display: flex; flex-wrap: wrap; gap: 6px; }
  .titles button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px; padding: 7px 14px; cursor: pointer; min-height: 40px; }
  .titles button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .field { display: grid; gap: 6px; }
  .field > span { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  input[type=text], input[type=search], select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; min-height: 44px; font-size: 16px; }
  .coach { display: grid; gap: 10px; }
  .coach li { margin: 0 0 6px; color: var(--ink-2); }
  .coach ol { margin: 0; padding-left: 20px; }

  @media (min-width: 900px) {
    #sheet { left: auto; right: 0; top: calc(64px + var(--safe-t)); bottom: calc(var(--dock-h) + var(--safe-b)); width: 420px; height: auto; max-height: none; border-radius: 18px 0 0 0; border-left: 1px solid var(--line); animation-name: drawerin; }
    #sheet.full { height: auto; }
    @keyframes drawerin { from { transform: translateX(40px); opacity: 0; } }
    .grab { display: none; }
    #sheet header { padding-top: 14px; }
    #dock { left: 50%; right: auto; transform: translateX(-50%); width: 560px; border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; }
    body.sheet-open #ctx, body.sheet-open #fabs { right: 430px; }
    body.sheet-open #tools { right: 430px; }
  }
  @media (max-width: 899px) {
    body.sheet-open #ctx, body.sheet-open #fabs, body.sheet-open #tools { display: none; }
    .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #modal { align-items: end; padding: 8px 8px calc(8px + var(--safe-b)); }
    .card { border-radius: 22px; padding: 18px; }
    .card.screen { min-height: calc(100% - 8px); }
    .unit-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 420px) { .pillr .k { display: none; } .pillr { min-height: 36px; padding: 3px 8px; } #leader small { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
