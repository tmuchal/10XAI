<meta charset="utf-8">
<title>운명극장</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0d17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&family=Black+Han+Sans&family=Song+Myung&family=Poor+Story&family=Do+Hyeon&family=Nanum+Myeongjo:wght@700;800&family=Yeon+Sung&family=Dokdo&family=Hahmlet:wght@500;700&family=Nanum+Pen+Script&display=swap">
<style>
  :root {
    color-scheme: dark;
    --velvet: #1b0d17; --velvet-2: #2b1323; --brass: #d9b36c; --brass-2: #f3dca4;
    --ink: #f6eef3; --muted: #bfaebb; --line: rgba(255, 236, 214, .16);
    --panel: rgba(22, 12, 20, .82); --panel-solid: #221219;
    --accent: #d9b36c; --accent-2: #c2466f; --accent-ink: #1b0d17;
    --good: #7fd6a4; --bad: #ff7a8a; --heart: #ff6f9a;
    --f-display: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', serif;
    --f-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --f-hand: 'Nanum Pen Script', 'Gowun Dodum', cursive;
    --dw: 400;
    --r: 16px;
    --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-back: cubic-bezier(.34, 1.56, .64, 1);
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  /* ---------- genre themes ---------- */
  body[data-genre="rofan"] { --accent: #e9c982; --accent-2: #b8365f; --panel: rgba(24, 12, 22, .8); --f-display: 'Gowun Batang', serif; --dw: 700; }
  body[data-genre="raise"] { --accent: #93d8c4; --accent-2: #f3a65b; --accent-ink: #0f2226; --panel: rgba(12, 24, 34, .8); --panel-solid: #122230; --f-display: 'Jua', 'Gowun Dodum', sans-serif; }
  body[data-genre="murim"] { --accent: #e3c58d; --accent-2: #c8412f; --accent-ink: #17120c; --panel: rgba(16, 18, 16, .82); --panel-solid: #171a17; --f-display: 'Song Myung', 'Gowun Batang', serif; }
  body[data-genre="star"] { --accent: #ff5aa8; --accent-2: #53e2ff; --accent-ink: #1a0614; --panel: rgba(14, 10, 26, .82); --panel-solid: #16102a; --f-display: 'Black Han Sans', 'Gowun Dodum', sans-serif; }
  body[data-genre="school"] { --accent: #ff9cc0; --accent-2: #6fc8ff; --accent-ink: #2b0d1c; --panel: rgba(26, 24, 58, .8); --panel-solid: #1d1b40; --line: rgba(214, 226, 255, .2); --heart: #ff7fae; --f-display: 'Poor Story', 'Jua', sans-serif; }
  body[data-genre="office"] { --accent: #ffbe76; --accent-2: #4fc3b5; --accent-ink: #231505; --panel: rgba(16, 21, 28, .84); --panel-solid: #141b24; --line: rgba(200, 220, 240, .16); --f-display: 'Do Hyeon', 'Gowun Dodum', sans-serif; }
  body[data-genre="joseon"] { --accent: #e6bd6e; --accent-2: #c23a2b; --accent-ink: #1e1208; --panel: rgba(30, 18, 12, .84); --panel-solid: #24160e; --line: rgba(240, 214, 170, .18); --f-display: 'Nanum Myeongjo', 'Song Myung', serif; --dw: 800; }
  body[data-genre="academy"] { --accent: #c3b1ff; --accent-2: #ffd479; --accent-ink: #150f33; --panel: rgba(16, 14, 42, .84); --panel-solid: #16133a; --line: rgba(210, 200, 255, .2); --f-display: 'Yeon Sung', 'Jua', sans-serif; }
  body[data-genre="apoc"] { --accent: #c9e25a; --accent-2: #ff7a3d; --accent-ink: #151a05; --panel: rgba(18, 18, 14, .86); --panel-solid: #191a14; --line: rgba(220, 230, 190, .16); --heart: #ff8a5c; --f-display: 'Dokdo', 'Do Hyeon', sans-serif; }
  body[data-genre="night"] { --accent: #e3576f; --accent-2: #a98cff; --accent-ink: #1c0409; --panel: rgba(20, 8, 16, .86); --panel-solid: #1c0b15; --line: rgba(255, 200, 214, .16); --heart: #ff5277; --f-display: 'Hahmlet', 'Gowun Batang', serif; --dw: 700; }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--velvet); color: var(--ink); font: 16px/1.6 var(--f-body); overflow: hidden; word-break: keep-all; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .scr { position: fixed; inset: 0; }
  .disp { font-family: var(--f-display); font-weight: var(--dw); }

  /* ---------- Title ---------- */
  #title { overflow-y: auto; overflow-x: hidden; background:
    radial-gradient(120% 60% at 50% -10%, rgba(217,179,108,.22), transparent 60%),
    repeating-linear-gradient(90deg, #22101c 0 22px, #1a0b15 22px 44px); }
  #title .wrap { max-width: 1160px; margin: 0 auto; padding: calc(24px + var(--safe-t)) 16px calc(40px + var(--safe-b)); display: grid; gap: 22px; }
  .marquee { text-align: center; display: grid; gap: 6px; justify-items: center; padding-top: 6px; }
  .marquee .eyebrow { letter-spacing: .38em; font-size: 12px; color: var(--brass); text-transform: uppercase; }
  .marquee h1 { font: 700 clamp(44px, 10vw, 86px)/1 'Gowun Batang', serif; margin: 0; color: var(--brass-2);
    text-shadow: 0 0 24px rgba(243,220,164,.35), 0 2px 0 #6d4a1d; letter-spacing: .06em; animation: glowT 5s ease-in-out infinite; }
  @keyframes glowT { 50% { text-shadow: 0 0 38px rgba(243,220,164,.55), 0 2px 0 #6d4a1d; } }
  .bulbs { display: flex; gap: 10px; }
  .bulbs i { width: 8px; height: 8px; border-radius: 50%; background: #ffe7a8; box-shadow: 0 0 10px #ffd36b; animation: chase 1.4s infinite; animation-delay: calc(var(--i) * .1s); }
  @keyframes chase { 0%, 100% { opacity: .3; box-shadow: none; transform: scale(.85); } 30% { opacity: 1; box-shadow: 0 0 14px #ffd36b; transform: scale(1.1); } }
  .marquee p { margin: 0; color: var(--muted); max-width: 46ch; text-wrap: balance; }

  /* curtain intro */
  #curtain { position: fixed; inset: 0; z-index: 70; pointer-events: none; display: flex; }
  #curtain i { flex: 1; background: repeating-linear-gradient(90deg, #5a0f22 0 18px, #3d0816 18px 36px, #6b1428 36px 44px); box-shadow: inset 0 -40px 60px rgba(0,0,0,.5); }
  #curtain i:first-child { transform-origin: left; animation: curL 1.5s .35s var(--ease-out) forwards; }
  #curtain i:last-child { transform-origin: right; animation: curR 1.5s .35s var(--ease-out) forwards; }
  #curtain b { position: absolute; left: 0; right: 0; top: 0; height: 64px; background: linear-gradient(#7a1a30, #4a0a1a); box-shadow: 0 8px 24px rgba(0,0,0,.6); animation: valance 1.3s 1.2s ease forwards; }
  @keyframes curL { to { transform: translateX(-102%) scaleX(.6); } }
  @keyframes curR { to { transform: translateX(102%) scaleX(.6); } }
  @keyframes valance { to { transform: translateY(-110%); } }

  /* continue strip */
  .resume { display: grid; gap: 10px; }
  .sec-h { display: flex; align-items: baseline; gap: 10px; }
  .sec-h h3 { margin: 0; font: 700 17px/1.2 'Gowun Batang', serif; color: var(--brass-2); }
  .sec-h small { color: var(--muted); font-size: 12.5px; }
  .rs-list { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .rcard { flex: 0 0 min(300px, 84vw); scroll-snap-align: start; display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 16px; cursor: pointer;
    border: 1px solid rgba(243,220,164,.3); background: linear-gradient(120deg, rgba(60,24,44,.9), rgba(26,12,20,.92)); box-shadow: 0 10px 24px rgba(0,0,0,.35); animation: popIn .5s var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 70ms); transition: transform .2s, border-color .2s; }
  .rcard:hover { transform: translateY(-2px); border-color: var(--brass); }
  .rcard .face { width: 58px; height: 58px; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,.08); border: 2px solid var(--brass); }
  .rcard .face svg { width: 100%; height: 100%; }
  .rcard .ri { min-width: 0; display: grid; gap: 2px; line-height: 1.3; }
  .rcard .ri b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rcard .ri small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rcard .pbar { height: 4px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 3px; }
  .rcard .pbar i { display: block; height: 100%; background: var(--brass); border-radius: 99px; }
  .rcard .go { height: 34px; padding: 0 12px; border-radius: 999px; background: var(--brass); color: #2a1408; display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; white-space: nowrap; }

  /* filters */
  .filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; justify-content: center; }
  @media (max-width: 560px) { .filters { justify-content: flex-start; } }
  .fchip { flex-shrink: 0; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(243,220,164,.3); background: rgba(20,8,16,.6); cursor: pointer; font-size: 14px; color: #f3e6d6; display: inline-flex; gap: 6px; align-items: center; transition: background .25s, color .25s, transform .2s; }
  .fchip small { font-size: 11.5px; opacity: .7; font-variant-numeric: tabular-nums; }
  .fchip:hover { transform: translateY(-1px); }
  .fchip.on { background: var(--brass); color: #2a1408; border-color: transparent; }

  /* playbills */
  .bills { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; perspective: 1000px; }
  .bill { position: relative; border-radius: 14px; overflow: hidden; min-height: 440px; display: flex; flex-direction: column; justify-content: flex-end;
    border: 1px solid rgba(243,220,164,.28); background: #140a10 center/cover no-repeat; box-shadow: 0 18px 40px rgba(0,0,0,.5); cursor: pointer; text-align: left; padding: 0; color: #fff; text-decoration: none;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease, box-shadow .25s ease, opacity .3s ease, background-image .4s; isolation: isolate; transform-style: preserve-3d;
    animation: billIn .6s var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes billIn { from { opacity: 0; transform: translateY(26px) scale(.96); } }
  .bill.leave { opacity: 0; transform: scale(.92); pointer-events: none; }
  .bill:hover { box-shadow: 0 26px 54px rgba(0,0,0,.65); }
  .bill .art { position: absolute; inset: 0 0 auto 0; height: 76%; display: flex; justify-content: center; z-index: -1; transition: transform .4s var(--ease-out); }
  .bill:hover .art { transform: translateY(-6px) scale(1.03); }
  .bill .art svg { height: 100%; width: auto; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); animation: artIn .8s var(--ease-out) backwards; }
  @keyframes artIn { from { opacity: 0; transform: translateY(16px); } }
  .bill::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(transparent 30%, rgba(10,4,8,.72) 50%, rgba(10,4,8,.96) 64%); }
  .bill .shine { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.22), transparent 42%); mix-blend-mode: soft-light; }
  .bill:hover .shine { opacity: 1; }
  .bill .txt { padding: 14px 14px 14px; display: grid; gap: 6px; }
  .bill .g { font-size: 11px; letter-spacing: .2em; color: var(--brass); }
  .bill h2 { margin: 0; font: 700 23px/1.2 'Gowun Batang', serif; text-wrap: balance; }
  .bill[data-g="raise"] h2 { font-family: 'Jua', sans-serif; font-weight: 400; }
  .bill[data-g="murim"] h2 { font-family: 'Song Myung', serif; font-weight: 400; letter-spacing: .04em; }
  .bill[data-g="star"] h2 { font-family: 'Black Han Sans', sans-serif; font-weight: 400; letter-spacing: .02em; }
  .bill[data-g="school"] h2 { font-family: 'Poor Story', sans-serif; font-weight: 400; }
  .bill[data-g="office"] h2 { font-family: 'Do Hyeon', sans-serif; font-weight: 400; }
  .bill[data-g="joseon"] h2 { font-family: 'Nanum Myeongjo', serif; font-weight: 800; }
  .bill[data-g="academy"] h2 { font-family: 'Yeon Sung', sans-serif; font-weight: 400; }
  .bill[data-g="apoc"] h2 { font-family: 'Dokdo', sans-serif; font-weight: 400; font-size: 27px; }
  .bill[data-g="night"] h2 { font-family: 'Hahmlet', serif; font-weight: 700; }
  .bill p { margin: 0; font-size: 13.5px; color: #e8dce4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .bill .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--brass-2); }
  .bill .meta span { border: 1px solid rgba(243,220,164,.3); border-radius: 999px; padding: 0 8px; }
  .bill .eprog { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bill .eprog .t { height: 4px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bill .eprog .t i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass), var(--brass-2)); border-radius: 99px; }
  .bill .bact { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 2px; }
  .bill .bact.two { grid-template-columns: 1fr auto; }
  .bbtn { height: 40px; border-radius: 11px; border: 0; background: var(--brass); color: #2a1408; font-weight: 700; font-size: 14px; cursor: pointer; padding: 0 12px; transition: transform .15s, filter .15s; }
  .bbtn:hover { filter: brightness(1.08); } .bbtn:active { transform: scale(.97); }
  .bbtn.alt { background: rgba(255,255,255,.08); color: #f3e6d6; border: 1px solid rgba(243,220,164,.3); font-weight: 400; }
  .bill .badge { position: absolute; top: 10px; left: 10px; z-index: 3; font-size: 11px; padding: 2px 9px; border-radius: 999px; background: rgba(12,6,10,.75); border: 1px solid rgba(243,220,164,.4); color: var(--brass-2); }
  .bill.war { background: linear-gradient(160deg, #1d2a1f, #0d130f); }
  .bill.war .art { align-items: center; font: 400 64px/1 'Black Han Sans', sans-serif; color: rgba(160,210,150,.18); letter-spacing: .1em; }
  .foot { text-align: center; color: var(--muted); font-size: 12.5px; }
  .empty-f { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 30px 0; }
  @media (max-width: 560px) {
    .bills { grid-template-columns: 1fr 1fr; gap: 10px; }
    .bill { min-height: 318px; border-radius: 12px; }
    .bill .art { height: 70%; }
    .bill .txt { padding: 10px 10px 10px; gap: 4px; }
    .bill h2, .bill[data-g] h2 { font-size: 16.5px; }
    .bill[data-g="apoc"] h2 { font-size: 20px; }
    .bill p { display: none; }
    .bill .g { font-size: 10px; letter-spacing: .12em; }
    .bill .meta { display: none; }
    .bbtn { height: 36px; font-size: 13px; padding: 0 8px; }
    .bill .bact.two { grid-template-columns: 1fr; }
    .bill.war .art { font-size: 40px; }
    .marquee h1 { font-size: 50px; }
  }

  .sound-btn { position: absolute; top: calc(14px + var(--safe-t)); right: 16px; z-index: 3; }
  .sound-btn:not(.on) svg path:last-child { opacity: .2; }

  /* ---------- Stage ---------- */
  #stage { background: #000; overflow: hidden; overflow: clip; --px: 0; --py: 0; }
  #bgwrap { position: absolute; inset: -3%; translate: calc(var(--px) * -16px) calc(var(--py) * -10px); transition: translate .6s ease-out; }
  #bgA, #bgB { position: absolute; inset: 0; background: center/cover no-repeat; transition: opacity .8s ease, filter .8s ease; transform-origin: var(--ox, 50%) var(--oy, 50%); will-change: transform, opacity; }
  #bgB { opacity: 0; }
  .kb { animation: kb 28s ease-in-out infinite alternate; }
  @keyframes kb { from { transform: scale(1.02) translate(0, 0); } to { transform: scale(1.13) translate(var(--kx, 1%), var(--ky, -1%)); } }
  .wipe-l { animation: wipeL .9s var(--ease-out) both, kb 28s ease-in-out infinite alternate; }
  .wipe-r { animation: wipeR .9s var(--ease-out) both, kb 28s ease-in-out infinite alternate; }
  @keyframes wipeL { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
  @keyframes wipeR { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .blur-in { animation: blurIn 1.1s ease both, kb 28s ease-in-out infinite alternate; }
  @keyframes blurIn { from { filter: blur(18px) brightness(1.3); opacity: 0; } to { filter: none; opacity: 1; } }
  .blur-out { filter: blur(12px); }
  #stage.shake #bgwrap, #stage.shake #chars { animation: shake .45s; }
  @keyframes shake { 20% { transform: translate(-8px, 3px); } 40% { transform: translate(7px, -4px); } 60% { transform: translate(-5px, 2px); } 80% { transform: translate(3px, 0); } }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
  #flash.on { animation: flash .6s; }
  @keyframes flash { 10% { opacity: .9; } 100% { opacity: 0; } }
  #fx { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; z-index: 1; }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.45)); }

  /* characters: .ch (position) > .cf (focus) > .cm (enter/exit/react) > .cb (idle) > svg */
  #chars { position: absolute; inset: 0; pointer-events: none; z-index: 2; translate: calc(var(--px) * 8px) calc(var(--py) * 4px); transition: translate .6s ease-out; }
  .ch { position: absolute; bottom: 0; height: min(86%, 900px, 150vw); aspect-ratio: 2 / 3; transform: translateX(-50%); transition: left .55s var(--ease-out); }
  .ch .cf, .ch .cm, .ch .cb { width: 100%; height: 100%; transform-origin: 50% 100%; }
  .ch .cf { transition: transform .45s var(--ease-out), filter .35s ease; }
  .ch svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 12px 22px rgba(0,0,0,.45)); }
  .ch.dim .cf { filter: brightness(.58) saturate(.78); transform: scale(.975); }
  .ch.focus .cf { transform: scale(1.035) translateY(-4px); filter: brightness(1.04); }
  .ch .cb { animation: breathe 4.8s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: none; } 50% { transform: translateY(-3px) scaleY(1.007); } }
  .cm.in-l { animation: inL .65s var(--ease-out) both; }
  .cm.in-r { animation: inR .65s var(--ease-out) both; }
  .cm.in-c { animation: inC .6s var(--ease-out) both; }
  @keyframes inL { from { opacity: 0; transform: translateX(-90px); } }
  @keyframes inR { from { opacity: 0; transform: translateX(90px); } }
  @keyframes inC { from { opacity: 0; transform: translateY(30px) scale(.97); } }
  .cm.out-l { animation: outL .42s ease-in forwards; }
  .cm.out-r { animation: outR .42s ease-in forwards; }
  .cm.out-c { animation: outC .42s ease-in forwards; }
  @keyframes outL { to { opacity: 0; transform: translateX(-70px); } }
  @keyframes outR { to { opacity: 0; transform: translateX(70px); } }
  @keyframes outC { to { opacity: 0; transform: translateY(24px); } }
  .cm.r-hop { animation: rHop .55s var(--ease-out); }
  @keyframes rHop { 30% { transform: translateY(-26px) scale(1.01, .99); } 60% { transform: translateY(0) scale(1.02, .97); } 80% { transform: translateY(-6px); } }
  .cm.r-shake { animation: rShake .5s; }
  @keyframes rShake { 15% { transform: translateX(-7px) rotate(-.6deg); } 30% { transform: translateX(7px) rotate(.6deg); } 45% { transform: translateX(-5px); } 60% { transform: translateX(5px); } 80% { transform: translateX(-2px); } }
  .cm.r-droop { animation: rDroop 1.5s ease-in-out; }
  @keyframes rDroop { 35% { transform: translateY(12px) rotate(-.8deg) scale(.99); } 70% { transform: translateY(8px); } }
  .cm.r-bounce { animation: rBounce .8s ease-out; }
  @keyframes rBounce { 15%, 45%, 75% { transform: translateY(-9px); } 30%, 60% { transform: translateY(0) scale(1.01, .985); } }
  .cm.r-sway { animation: rSway 1.3s ease-in-out; }
  @keyframes rSway { 25% { transform: rotate(-1.8deg) translateX(-4px); } 60% { transform: rotate(1.4deg) translateX(3px); } }
  .cm.r-turn { animation: rTurn 1s ease-in-out; }
  @keyframes rTurn { 40% { transform: perspective(900px) rotateY(14deg) translateX(8px); } 70% { transform: perspective(900px) rotateY(10deg) translateX(6px); } }
  .cm.r-shiver { animation: rShiver .6s linear; }
  @keyframes rShiver { 20%, 60% { transform: translateX(-2px); } 40%, 80% { transform: translateX(2px); } }
  .cm.r-lift { animation: rLift .6s var(--ease-out); }
  @keyframes rLift { 40% { transform: translateY(-7px); } }
  .cm.r-sink { animation: rSink 1.4s ease-in-out; }
  @keyframes rSink { 50% { transform: translateY(14px) scale(.99); } }

  #savetick { position: absolute; top: calc(60px + var(--safe-t)); right: 14px; z-index: 6; display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; color: var(--muted); padding: 3px 9px 3px 7px; border-radius: 999px; background: rgba(0,0,0,.45); opacity: 0; transform: translateY(-4px); transition: opacity .35s, transform .35s; pointer-events: none; }

  /* dialogue box */
  #box { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px calc(12px + var(--safe-b)); z-index: 5; transition: opacity .35s, transform .35s; animation: boxIn .45s var(--ease-out); }

  /* choices */

  /* chapter card */
  #card { position: absolute; inset: 0; z-index: 9; display: grid; place-content: center; text-align: center; overflow: hidden; cursor: pointer;

  #card .seal { position: absolute; right: -54px; top: -26px; width: 48px; height: 48px; border: 3px solid #b3261e; color: #b3261e; border-radius: 6px; font: 800 13px/1.05 'Nanum Myeongjo', serif; display: grid; place-items: center; transform: rotate(-8deg); animation: seal .5s 1.4s var(--ease-back) both; mix-blend-mode: multiply; }

  #card.cs-moon .ct::before { content: ''; position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #ffe9e9, #d9a0a8 60%, transparent 71%); opacity: .22; animation: fadeIn 2s both; }

  /* toasts */
  #toasts { position: absolute; top: calc(64px + var(--safe-t)); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; z-index: 12; pointer-events: none; justify-items: center; width: min(420px, calc(100% - 32px)); }

  #fxl .plus { position: absolute; transform: translate(-50%, -50%); font: 700 22px/1 var(--f-body); color: var(--heart); text-shadow: 0 2px 10px rgba(0,0,0,.6), 0 0 12px rgba(255,111,154,.6); white-space: nowrap; animation: plus 1.6s var(--ease-out) forwards; font-variant-numeric: tabular-nums; }

  #hubl .hubchar:hover .cb { animation: breathe 4.8s ease-in-out infinite, rLift .6s var(--ease-out); }
  #hubl .date { display: grid; line-height: 1.2; }

  .goalc { margin: 0 12px; justify-self: start; max-width: min(360px, calc(100% - 24px)); padding: 10px 14px 10px 12px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: goalIn .6s .2s var(--ease-out) backwards; box-shadow: 0 10px 26px rgba(0,0,0,.3); }

  @keyframes bulbP { 50% { opacity: .35; } }

  .dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 12px 12px calc(12px + var(--safe-b)); display: grid; grid-template-columns: repeat(4, 1fr) 1.6fr; gap: 8px; max-width: 760px; margin: 0 auto;
    background: linear-gradient(transparent, rgba(0,0,0,.6) 30%); }

  /* month play */

  /* month flip */

  .affb { align-self: center; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; animation: bump .5s var(--ease-back); }

  @keyframes dot { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
  #chat .quick { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 8px; max-width: 720px; width: 100%; margin: 0 auto; scrollbar-width: none; }
  #chat .quick button { flex-shrink: 0; height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 10%, rgba(0,0,0,.4)); cursor: pointer; font-size: 13px; animation: optIn .4s var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 50ms); }

  /* ending */
  #ending { z-index: 30; background: #000; overflow-y: auto; }
  #ending .eb { position: fixed; inset: -2%; background: center/cover no-repeat; filter: brightness(.6) saturate(1.1); animation: endZoom 26s ease-out forwards, fadeIn 1.6s ease; transform-origin: 50% 40%; }
  @keyframes endZoom { from { transform: scale(1); } to { transform: scale(1.16); } }

  #ending .end-char { position: fixed; bottom: 0; left: 50%; height: min(78%, 150vw); aspect-ratio: 2/3; transform: translateX(-50%); opacity: .95; animation: ecIn 2.2s .5s var(--ease-out) backwards; }

  #ending .rank { font: 400 13px/1 var(--f-body); letter-spacing: .3em; color: var(--accent); }

  @keyframes credit { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } }
  #ending .stamp { position: absolute; right: 16px; top: 14px; width: 66px; height: 66px; border-radius: 50%; border: 3px solid var(--accent-2); color: var(--accent-2); display: grid; place-items: center; font: 700 30px/1 var(--f-display); transform: rotate(-12deg); animation: stamp .55s var(--ease-back) both; animation-delay: var(--d); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--accent-2) 30%, transparent); background: rgba(0,0,0,.25); }

  #ending .later { animation: fadeIn .8s ease both; animation-delay: var(--d); }
