<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Immersive Brand Page</title>
<style>
  :root {
    --bg: #0d0d11; --panel: #17171d; --panel2: #202029; --line: #2e2e3a; --text: #f4f1ea; --muted: #a09c93;
    --cream: #f2ebe0; --ink: #17140f; --terra: #d4623a; --forest: #1e3a33; --gold: #c8a266; --sky: #6fb3d9; --pink: #f08aa0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Noto Sans CJK KR", system-ui, sans-serif; }
  .serif { font-family: "Noto Serif CJK KR", serif; }
  .mono { font-family: "DejaVu Sans Mono", monospace; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(1400px 800px at 50% 0%, #1c1b24 0%, transparent 70%), var(--bg); }
  .scene { position: absolute; inset: 0; opacity: 0; display: none; }
  .abs { position: absolute; }
  .chap { position: absolute; left: 96px; top: 64px; }
  .chap .k { font-size: 20px; letter-spacing: 5px; color: var(--gold); }
  .chap .t { font-size: 46px; font-weight: 800; margin-top: 4px; }
  .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 260px;
    background: linear-gradient(to top, rgba(8,8,10,.94), rgba(8,8,10,0)); }
  #cap { position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; z-index: 50; }
  #cap .ko { font-size: 42px; font-weight: 700; letter-spacing: -.5px; }
  #cap .en { font-size: 22px; color: var(--muted); margin-top: 8px; }
  #cite { position: absolute; right: 40px; bottom: 16px; font-size: 16px; color: #77736b; z-index: 50; }
  .win { position: absolute; background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); }
  .bar { height: 44px; background: #1e1e25; display: flex; align-items: center; gap: 9px; padding: 0 18px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .addr { margin-left: 14px; flex: 1; height: 28px; border-radius: 8px; background: #111116; color: #d9d6cf;
    font-size: 16px; display: flex; align-items: center; padding: 0 14px; }
  .view { position: relative; overflow: hidden; background: var(--cream); }
  .page { position: absolute; left: 0; top: 0; width: 1440px; transform-origin: 0 0; background: var(--cream); color: var(--ink); }
  .film { position: absolute; inset: 0; overflow: hidden; }
  .film svg { width: 100%; height: 100%; display: block; }
  .card { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .chip { display: inline-block; padding: 8px 16px; border-radius: 999px; border: 2px solid var(--line); font-size: 20px; }
  .btn { display: inline-grid; place-items: center; padding: 12px 22px; border-radius: 999px; font-weight: 800; font-size: 18px; }
  .bubble { position: absolute; background: #fff; color: var(--ink); border-radius: 22px; padding: 16px 22px; font-size: 26px;
    font-weight: 700; box-shadow: 0 16px 40px rgba(0,0,0,.4); white-space: nowrap; z-index: 40; }
  .bubble::after { content: ""; position: absolute; left: 34px; bottom: -14px; border: 14px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .noa { position: absolute; left: 0; top: 0; z-index: 30; }
  .reftag { position: absolute; padding: 8px 16px; border-radius: 10px; background: var(--gold); color: #1a1406; font-weight: 800; font-size: 20px; letter-spacing: 1px; z-index: 5; }
  .stat { font-size: 64px; font-weight: 900; color: var(--gold); line-height: 1; }
  .progress { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--gold); z-index: 60; }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div class="scrim" style="z-index:45"></div>
  <div id="cap"><div class="ko"></div><div class="en"></div></div>
  <div id="cite"></div>
  <div class="progress" id="prog"></div>
</div>

<script>
// ============================================================================
// Deterministic timeline. window.render(t) draws the frame at t seconds;
// render.cjs steps it frame by frame. Opened normally, it autoplays.
//
// REFERENCE: drop a full-page screenshot of your site at ref/page.png
// (1440px wide works best). Without it, an example mockup is shown.
// REF_MARKS: where the hook / proof / action labels sit (0..1 of page height).
// ============================================================================
const REF_URL = "noainostory.higgsfield.app";
const REF_MARKS = [[0.02, "훅 · Hook"], [0.4, "증거 · Proof"], [0.86, "행동 · Action"]];

const DURATION = 192, FADE = 0.6;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const type = (s, p) => s.slice(0, Math.round(s.length * clamp(p)));
const lerp = (a, b, p) => a + (b - a) * p;
function el(tag, css, html, parent) {
  const e = document.createElement(tag);
  if (css) e.style.cssText = css;
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
// fade + rise helper
function pop(node, t, a, d = 0.6, dy = 24) {
  const p = out(seg(t, a, a + d));
  node.style.opacity = p; node.style.transform = `translateY(${dy * (1 - p)}px)`;
  return p;
}
const fmt = n => Math.round(n).toLocaleString("ko-KR");

// ---------------------------------------------------------------- Film (SVG landscape)
const PAL = {
  dawn:   { s1: "#2b2140", s2: "#e07a4f", sun: "#ffd9a8", r: ["#6b4a5c", "#3f2c3d", "#1d1520"], mist: "#f4c9a8" },
  forest: { s1: "#14302b", s2: "#8fb59a", sun: "#f3efd6", r: ["#35584d", "#20403a", "#0f211d"], mist: "#d7e6d5" },
  gold:   { s1: "#3b2a17", s2: "#e9b56b", sun: "#fff1cf", r: ["#8a5a33", "#5a3a22", "#2a1b10"], mist: "#f7ddb0" },
  night:  { s1: "#0d1328", s2: "#4b3f7a", sun: "#e9e4ff", r: ["#2b2d52", "#1b1c38", "#0c0c1c"], mist: "#8d86c9" },
  sea:    { s1: "#0f2a3f", s2: "#6fb3d9", sun: "#f5fbff", r: ["#2f5d7a", "#1d3f57", "#0c2233"], mist: "#cfe8f5" },
};
let uid = 0;
const ridge = (base, amps, k) => {
  let d = `M0 900 L0 ${base}`;
  for (let x = 0; x <= 3200; x += 32) {
    const y = base + amps[0] * Math.sin(2 * Math.PI * x * k[0] / 1600 + 1.3) + amps[1] * Math.sin(2 * Math.PI * x * k[1] / 1600 + .4);
    d += ` L${x} ${y.toFixed(1)}`;
  }
  return d + " L3200 900 Z";
};
function makeFilm(pal) {
  const id = "f" + uid++;
  const e = el("div"); e.className = "film";
  e.innerHTML = `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.s1}"/><stop offset="1" stop-color="${pal.s2}"/></linearGradient>
      <radialGradient id="${id}g"><stop offset="0" stop-color="${pal.sun}"/><stop offset=".22" stop-color="${pal.sun}" stop-opacity=".9"/><stop offset="1" stop-color="${pal.sun}" stop-opacity="0"/></radialGradient>
      <linearGradient id="${id}m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.mist}" stop-opacity="0"/><stop offset=".5" stop-color="${pal.mist}" stop-opacity=".45"/><stop offset="1" stop-color="${pal.mist}" stop-opacity="0"/></linearGradient>
    </defs>
    <g class="cam">
      <rect x="-200" y="-200" width="2000" height="1300" fill="url(#${id}s)"/>
      <circle class="sun" cx="1050" cy="520" r="360" fill="url(#${id}g)"/>
      <path class="r0" d="${ridge(560, [40, 22], [2, 5])}" fill="${pal.r[0]}"/>
      <rect class="mist" x="-200" y="520" width="2000" height="220" fill="url(#${id}m)"/>
      <path class="r1" d="${ridge(650, [55, 25], [1, 4])}" fill="${pal.r[1]}"/>
      <path class="r2" d="${ridge(760, [45, 18], [3, 7])}" fill="${pal.r[2]}"/>
    </g></svg>`;
  const q = s => e.querySelector(s);
  const P = { cam: q(".cam"), sun: q(".sun"), r0: q(".r0"), r1: q(".r1"), r2: q(".r2"), mist: q(".mist") };
  e.update = (t, sp = 1) => {
    const s = t * sp;
    P.cam.setAttribute("transform", `translate(800 450) scale(${1.04 + 0.03 * Math.sin(s * 0.25)}) translate(-800 -450)`);
    P.sun.setAttribute("cy", 520 - 60 * Math.sin(s * 0.18));
    P.r0.setAttribute("transform", `translate(${-(s * 12) % 1600} 0)`);
    P.r1.setAttribute("transform", `translate(${-(s * 30) % 1600} 0)`);
    P.r2.setAttribute("transform", `translate(${-(s * 60) % 1600} 0)`);
    P.mist.setAttribute("transform", `translate(${40 * Math.sin(s * 0.3)} 0)`);
  };
  e.update(0);
  return e;
}

// ---------------------------------------------------------------- Noa (the guide character)
// One fixed design — beret, gold scarf, cream body — reused in every scene.
// Variants exist only for the "inconsistent character" gag in chapter 03.
const NOA = { body: "#f2ebe0", beret: "#d4623a", scarf: "#c8a266" };
function makeNoa(size = 200, v = {}) {
  const c = Object.assign({}, NOA, v);
  const e = el("div"); e.className = "noa"; e.style.width = size + "px"; e.style.height = size * 1.1 + "px";
  e.innerHTML = `<svg viewBox="0 0 200 220" width="100%" height="100%">
    <ellipse cx="100" cy="212" rx="55" ry="7" fill="rgba(0,0,0,.35)"/>
    <g class="b">
      <path class="al" d="M50 132 Q28 124 22 102" stroke="#17140f" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path class="ar" d="M150 132 Q172 124 178 102" stroke="#17140f" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M100 42 C150 42 164 92 162 140 C160 184 136 205 100 205 C64 205 40 184 38 140 C36 92 50 42 100 42Z" fill="${c.body}" stroke="#17140f" stroke-width="3"/>
      ${c.spiky ? `<path d="M62 60 L70 30 L82 56 L96 22 L106 54 L122 26 L128 58 L142 36 L140 66Z" fill="#3b2f7a"/>` : ""}
      <path d="M48 150 Q100 176 152 150 L154 166 Q100 192 46 166Z" fill="${c.scarf}"/>
      <path d="M128 168 L140 198 L124 196Z" fill="${c.scarf}"/>
      <g class="eyes">
        <ellipse class="e1" cx="80" cy="106" rx="9" ry="13" fill="#17140f"/><ellipse class="e2" cx="120" cy="106" rx="9" ry="13" fill="#17140f"/>
        <circle cx="83" cy="101" r="3" fill="#fff"/><circle cx="123" cy="101" r="3" fill="#fff"/>
      </g>
      ${c.glasses ? `<g fill="none" stroke="#17140f" stroke-width="4"><circle cx="80" cy="106" r="19"/><circle cx="120" cy="106" r="19"/><path d="M99 106 L101 106"/></g>` : ""}
      <ellipse cx="66" cy="130" rx="10" ry="6" fill="#f08aa0" opacity=".55"/><ellipse cx="134" cy="130" rx="10" ry="6" fill="#f08aa0" opacity=".55"/>
      <path class="m" d="M88 134 Q100 146 112 134" stroke="#17140f" stroke-width="4" fill="none" stroke-linecap="round"/>
      ${c.spiky ? "" : `<g class="beret"><ellipse cx="100" cy="50" rx="50" ry="16" fill="${c.beret}" transform="rotate(-8 100 50)"/><circle cx="100" cy="33" r="6" fill="${c.beret}"/></g>`}
    </g></svg>`;
  const q = s => e.querySelector(s);
  e.P = { b: q(".b"), al: q(".al"), ar: q(".ar"), eyes: q(".eyes"), e1: q(".e1"), e2: q(".e2"), m: q(".m") };
  e.seed = (uid++ % 7) * 0.47;
  return e;
}
// pose: { x, y, s (scale), wave (0/1), talk (bool), look (-1..1), mood: happy|shock|pout, flip }
function poseNoa(n, t, o) {
  const { x = 0, y = 0, s = 1, wave = 0, talk = false, look = 0, mood = "happy", flip = false, hop = 0, op = 1 } = o;
  const bob = Math.sin((t + n.seed) * 3) * 4 - Math.abs(Math.sin(hop * Math.PI)) * 60;
  n.style.transform = `translate(${x}px, ${y + bob}px) scale(${flip ? -s : s}, ${s})`;
  n.style.transformOrigin = "50% 100%";
  n.style.opacity = op;
  const squash = 1 + 0.03 * Math.sin((t + n.seed) * 6);
  n.P.b.setAttribute("transform", `translate(100 205) scale(${2 - squash} ${squash}) translate(-100 -205)`);
  const blink = ((t + n.seed) % 3.3) < 0.12;
  const ry = mood === "shock" ? 16 : blink ? 1.5 : 13;
  n.P.e1.setAttribute("ry", ry); n.P.e2.setAttribute("ry", ry);
  n.P.eyes.setAttribute("transform", `translate(${look * 5} 0)`);
  const open = talk && Math.floor(t * 8) % 2 === 0;
  n.P.m.setAttribute("d",
    mood === "shock" ? "M94 138 Q100 128 106 138 Q100 150 94 138Z" :
    mood === "pout" ? "M90 140 Q100 132 110 140" :
    open ? "M88 134 Q100 152 112 134 Q100 140 88 134Z" : "M88 134 Q100 146 112 134");
  n.P.m.setAttribute("fill", mood === "shock" || open ? "#17140f" : "none");
  const w = wave ? Math.sin(t * 10) * 18 - 20 : 0;
  n.P.ar.setAttribute("transform", `rotate(${w} 150 132)`);
  n.P.al.setAttribute("transform", `rotate(${mood === "shock" ? 30 : 0} 50 132)`);
}
function makeBubble(parent) { const b = el("div", "opacity:0", "", parent); b.className = "bubble"; return b; }
function sayBubble(b, t, a, z, text, x, y) {
  const p = out(seg(t, a, a + .3)) * (1 - seg(t, z - .3, z));
  b.style.opacity = p; b.style.left = x + "px"; b.style.top = y + "px";
  b.style.transform = `scale(${0.85 + 0.15 * p})`; b.style.transformOrigin = "20% 100%";
  b.textContent = type(text, seg(t, a, a + Math.max(.5, text.length * .045)));
}

// ---------------------------------------------------------------- Brand page mock (fallback reference)
function brandPage() {
  const p = el("div"); p.className = "page";
  p.innerHTML = `
  <section style="position:relative;height:84px;display:flex;align-items:center;padding:0 64px;gap:40px;background:var(--cream);z-index:2">
    <div class="serif" style="font-size:28px;font-weight:700;letter-spacing:5px">NOAINO STORY</div>
    <div style="margin-left:auto;display:flex;gap:36px;font-size:17px;color:#5d554a"><span>About</span><span>Services</span><span>Work</span><span>Contact</span></div>
    <div style="padding:12px 22px;border-radius:999px;background:var(--terra);color:#fff;font-size:16px;font-weight:700">문의하기</div></section>
  <section style="position:relative;height:700px;overflow:hidden;background:#222"><div class="s-hero"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,10,8,.72),rgba(15,10,8,.05) 70%)"></div>
    <div style="position:absolute;left:80px;top:190px;color:#fff;width:720px">
      <div style="font-size:17px;letter-spacing:5px;color:var(--gold)">BRAND FILM · SEOUL</div>
      <div class="serif" style="font-size:78px;font-weight:700;line-height:1.18;margin-top:18px">이야기가<br>브랜드가 되는 곳</div>
      <div style="font-size:22px;margin-top:22px;color:#eadfd0">당신의 브랜드를 영상과 이미지로 이야기합니다.</div>
      <div style="display:flex;gap:14px;margin-top:34px"><div style="padding:16px 28px;border-radius:999px;background:var(--terra);font-size:18px;font-weight:700">프로젝트 문의</div>
      <div style="padding:16px 28px;border-radius:999px;border:1.5px solid rgba(255,255,255,.6);font-size:18px">▶ 브랜드 필름 보기</div></div></div></section>
  <section style="position:relative;height:560px;display:flex;gap:70px;padding:90px 80px">
    <div class="s-about" style="position:relative;width:560px;height:380px;border-radius:18px;overflow:hidden;flex:none"></div>
    <div style="padding-top:30px"><div style="font-size:16px;letter-spacing:4px;color:var(--terra)">ABOUT</div>
      <div class="serif" style="font-size:50px;font-weight:700;margin-top:12px;line-height:1.3">작은 브랜드에도<br>큰 이야기를</div>
      <div style="font-size:20px;color:#5d554a;margin-top:20px;line-height:1.75;width:560px">브랜드의 목소리를 정하고, 그 목소리로 영상과 이미지를 만듭니다.</div></div></section>
  <section style="position:relative;height:540px;padding:70px 80px;background:#e9e0d2">
    <div style="font-size:16px;letter-spacing:4px;color:var(--terra)">SERVICES</div>
    <div style="display:flex;gap:28px;margin-top:26px">${["브랜드 필름", "제품 비주얼", "캠페인 페이지"].map(n => `<div style="flex:1;background:var(--cream);border-radius:18px;overflow:hidden">
      <div class="s-th" style="position:relative;height:220px"></div><div style="padding:22px 24px"><div class="serif" style="font-size:28px;font-weight:700">${n}</div>
      <div style="font-size:16px;color:#6b6358;margin-top:8px">Higgsfield로 제작</div></div></div>`).join("")}</div></section>
  <section style="position:relative;height:300px;background:var(--forest);color:#f2ebe0;display:flex;align-items:center;justify-content:space-between;padding:0 80px">
    <div class="serif" style="font-size:54px;font-weight:700">함께 이야기를 만들어요</div>
    <div style="padding:20px 34px;border-radius:999px;background:var(--gold);color:#1a1406;font-size:20px;font-weight:800">프로젝트 문의 →</div></section>`;
  const films = [];
  const h = makeFilm(PAL.dawn); p.querySelector(".s-hero").replaceWith(h); films.push([h, 1]);
  const a = makeFilm(PAL.forest); p.querySelector(".s-about").appendChild(a); films.push([a, .6]);
  [PAL.gold, PAL.night, PAL.dawn].forEach((pl, i) => { const f = makeFilm(pl); p.querySelectorAll(".s-th")[i].appendChild(f); films.push([f, .5 + i * .2]); });
  p.update = t => films.forEach(([f, sp]) => f.update(t + sp * 7, sp));
  p.fullH = 2184;
  return p;
}

// A browser window showing the reference page: ref/page.png if present, else the mockup.
const REFS = [];
function refWindow(parent, x, y, w, h) {
  const win = el("div", `left:${x}px;top:${y}px;width:${w}px;height:${h}px`, "", parent); win.className = "win";
  win.innerHTML = `<div class="bar"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div><div class="addr mono">🔒&nbsp;${REF_URL}</div></div>`;
  const view = el("div", `height:${h - 44}px`, "", win); view.className = "view";
  const k = w / 1440;
  const mock = brandPage(); mock.style.transform = `scale(${k})`; view.appendChild(mock);
  const img = el("img", `position:absolute;left:0;top:0;width:${w}px;display:none`, null, view);
  img.onload = () => { img.style.display = "block"; mock.style.display = "none"; win.real = true; };
  img.src = "ref/page.png";
  const tag = el("div", "right:16px;top:58px", "REFERENCE · 제가 만든 페이지", win); tag.className = "reftag";
  win.view = view; win.k = k; win.mock = mock; win.img = img; win.viewH = h - 44;
  // scroll to a fraction of the page height
  win.scrollTo = (f, t) => {
    if (win.real) { const H = img.naturalHeight * (w / img.naturalWidth); img.style.transform = `translateY(${-f * Math.max(0, H - win.viewH)}px)`; }
    else { mock.update(t); mock.style.transform = `scale(${k}) translateY(${-f * Math.max(0, mock.fullH - win.viewH / k)}px)`; }
  };
  REFS.push(win);
  return win;
}

// ============================================================================ SCENES
const SC = [];
function scene(a, b, build) {
  const root = el("div", "", "", $("scenes")); root.className = "scene";
  const s = { a, b, root, caps: [], cite: [] };
  s.update = build(root, s) || (() => {});
  SC.push(s);
  return s;
}
function chapter(root, k, t) { const c = el("div", "", `<div class="k">${k}</div><div class="t">${t}</div>`, root); c.className = "chap"; return c; }

// ---------------------------------------------------------------- 00 · Opening (0–10)
scene(0, 10, (R, s) => {
  s.caps = [[0.2, "방문자는 0.05초 만에 첫인상을 정합니다", "Visitors judge a page in 50 milliseconds"],
            [5.2, "그 0.05초를 붙잡는 페이지, Claude × Higgsfield", "Pages that hold that moment, built with Claude × Higgsfield"]];
  s.cite = [[0, "Lindgaard et al., 2006 · Behaviour & IT"]];
  const timer = el("div", "left:0;right:0;top:360px;text-align:center;font-size:150px;font-weight:900", "", R); timer.className = "abs mono";
  const ref = refWindow(R, 260, 70, 1400, 780);
  const title = el("div", "left:0;right:0;top:250px;text-align:center;z-index:20", `
    <div style="font-size:26px;letter-spacing:6px;color:var(--gold)">CLAUDE × HIGGSFIELD</div>
    <div class="serif" style="font-size:96px;font-weight:800;margin-top:16px;line-height:1.15;text-shadow:0 10px 40px rgba(0,0,0,.6)">사람을 붙잡는<br>브랜드 페이지</div>`, R); title.className = "abs";

  const layers = F.map((f, i) => el("div", `position:absolute;left:${(900 - f[2]) / 2}px;top:${i * 104}px;width:${f[2]}px;height:92px;border-radius:14px;background:${["#2a2a33", "#34302a", "#3e3524", "#4d3c20", "#c8a266"][i]};display:flex;align-items:center;justify-content:center;gap:14px;${i === 4 ? "color:#1a1406" : ""}`,
    `<span style="font-size:32px;font-weight:900">${f[0]}</span><span style="font-size:18px;opacity:.7">${f[1]}</span>`, fun));
  const dots = Array.from({ length: 40 }, (_, i) => el("div", "position:absolute;width:14px;height:14px;border-radius:50%;background:#dcd8cf;opacity:0", "", fun));
  const coins = Array.from({ length: 8 }, () => el("div", "position:absolute;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a8,#c8a266 60%,#8a6a2e);border:2px solid #8a6a2e;opacity:0;z-index:3", "", R));
  const catcher = makeNoa(150); R.appendChild(catcher);
  const form = el("div", "left:1110px;top:200px;width:720px", "", R); form.className = "abs";
  form.innerHTML = `<div style="font-size:18px;letter-spacing:4px;color:var(--gold)">REVENUE · 예시</div>
    <div style="font-size:30px;line-height:2;margin-top:10px">
      방문자 <b class="mono">3,000</b> × 전환율 <b class="mono cr" style="color:var(--gold)">1.5%</b> × 객단가 <b class="mono">60,000원</b></div>
    <div class="rev mono" style="font-size:66px;font-weight:900;margin-top:10px">= 2,700,000원</div>
    <div class="up" style="font-size:22px;color:#27c26a;margin-top:10px;opacity:0">몰입 + 신뢰로 전환율 1.5% → 2.5%</div>`;
  const ctas = el("div", "left:1110px;top:560px;width:720px;display:grid;grid-template-columns:1fr 1fr;gap:14px", "", R); ctas.className = "abs";
  const CT = [["에이전시", "상담 예약"], ["쇼핑몰", "장바구니"], ["오프라인 매장", "길찾기 · 예약"], ["인플루언서", "공구 링크"]].map(c => el("div", "padding:16px 20px;border-radius:14px;background:var(--panel);border:1px solid var(--line)", `<div style="font-size:17px;color:var(--muted)">${c[0]}</div><div style="font-size:26px;font-weight:800;color:var(--gold)">${c[1]} →</div>`, ctas));
  const soft = el("div", "left:1110px;top:800px;font-size:20px;color:#dcd8cf", "보조 CTA · 카탈로그 받기 / 쿠폰 / 뉴스레터", R); soft.className = "abs";
  const ref = refWindow(R, 300, 180, 1320, 690);
  const noa = makeNoa(150); R.appendChild(noa); const bub = makeBubble(R);
  return t => {
    const M = seg(t, 160.2, 160.8) * (1 - seg(t, 177.4, 178));
    fun.style.opacity = M; form.style.opacity = seg(t, 167, 167.6) * M; ctas.style.opacity = M; soft.style.opacity = M;
    layers.forEach((l, i) => pop(l, t, 160.4 + i * .3, .5, 20));
    dots.forEach((d, i) => {
      const life = ((t - 161.5 - i * .17) % 4 + 4) % 4, alive = t > 161.5 + i * .17;
      const depth = Math.min(4, Math.floor(life / .8)), keep = [1, .75, .55, .3, .15][depth] > ((i * 37) % 100) / 100;
      const x = 450 + ((i * 53) % 13 - 6) * (F[depth][2] / 30), y = 40 + life * 104 / .8;
      d.style.left = x + "px"; d.style.top = Math.min(y, 470) + "px";
      d.style.opacity = alive && keep && life < 3.8 ? M * .9 : 0;
    });
    coins.forEach((c, i) => {
      const life = ((t - 163 - i * .5) % 4 + 4) % 4, alive = t > 163 + i * .5 && t < 177;
      c.style.left = (590 + ((i * 41) % 60) - 30) + "px"; c.style.top = (720 + life * 60) + "px";
      c.style.opacity = alive && life < 1.4 ? M : 0; c.style.transform = `rotateY(${t * 400}deg)`;
    });
    poseNoa(catcher, t, { x: 520 + 40 * Math.sin(t * 2.2), y: 700, s: .8, mood: "happy", wave: true, op: seg(t, 163, 163.4) * M });
    const boost = ease(seg(t, 170, 172));
    form.querySelector(".cr").textContent = (1.5 + boost).toFixed(1) + "%";
    form.querySelector(".rev").textContent = "= " + fmt(3000 * (0.015 + 0.01 * boost) * 60000) + "원";
    form.querySelector(".up").style.opacity = seg(t, 170, 170.5);
    CT.forEach((c, i) => { const p = pop(c, t, 173 + i * .4, .5, 16); c.style.opacity = p; });
    soft.style.opacity = seg(t, 175, 175.5) * M;
    const r = out(seg(t, 178, 178.8));
    ref.style.opacity = r; ref.style.transform = `scale(${0.92 + 0.08 * r})`;
    ref.scrollTo(lerp(0.7, 1, ease(seg(t, 178.5, 182.5))), t);
    poseNoa(noa, t, { x: 1640, y: 740, s: .85, talk: t > 179.5 && t < 182, look: -1, op: seg(t, 178.8, 179.2) });
    sayBubble(bub, t, 179.5, 183.8, "마지막은 늘 버튼 하나 👉", 1320, 660);
  };
});

// ---------------------------------------------------------------- 07 · Outro (184–192)
scene(184, 192, (R, s) => {
  s.caps = [[184.2, "다음 페이지의 주인공은, 당신의 브랜드", "The next hero is your brand"]];
  const title = el("div", "left:0;right:0;top:130px;text-align:center", `<div style="font-size:24px;letter-spacing:6px;color:var(--gold)">CLAUDE × HIGGSFIELD</div>
    <div class="serif" style="font-size:72px;font-weight:800;margin-top:14px">사람을 붙잡는 브랜드 페이지</div>`, R); title.className = "abs";
  const chips = el("div", "left:0;right:0;top:360px;text-align:center", "", R); chips.className = "abs";
  const CH = ["업종 무관", "고객이 주인공", "Soul ID 일관성", "3초 · 스크롤 · 영상", "전문성 + 유머", "버튼 → 매출"].map(c => el("span", "margin:0 8px;font-size:26px;border-color:var(--gold)", c, chips));
  CH.forEach(c => c.className = "chip");
  const url = el("div", "left:0;right:0;top:470px;text-align:center;font-size:48px", `${REF_URL.split(".")[0]}<span style="color:var(--gold)">.${REF_URL.split(".").slice(1).join(".")}</span>`, R); url.className = "abs mono";
  const noa = makeNoa(220); R.appendChild(noa);
  return t => {
    pop(title, t, 184.2, .7, 30);
    CH.forEach((c, i) => { const p = back(seg(t, 185 + i * .2, 185.5 + i * .2)); c.style.opacity = clamp(p); c.style.display = "inline-block"; c.style.transform = `scale(${0.7 + 0.3 * p})`; });
    const u = out(seg(t, 186.6, 187.4)); url.style.opacity = u; url.style.letterSpacing = `${6 * (1 - u)}px`;
    poseNoa(noa, t, { x: 850, y: 600, s: 1, wave: true, talk: t > 187.5 && t < 190, op: seg(t, 184.5, 185) });
  };
});

// ============================================================================ RENDER
const capKo = document.querySelector("#cap .ko"), capEn = document.querySelector("#cap .en");
function render(t) {
  let cap = null, cite = "";
  SC.forEach(s => {
    const o = t < s.a || t > s.b ? 0 : s.a === 0 ? 1 - seg(t, s.b - FADE, s.b) : s.b === DURATION ? seg(t, s.a, s.a + FADE)
      : Math.min(seg(t, s.a, s.a + FADE), 1 - seg(t, s.b - FADE, s.b));
    s.root.style.opacity = o; s.root.style.display = o > 0 ? "block" : "none";
    if (o > 0) {
      s.root.style.transform = `scale(${1 + 0.012 * (1 - o)})`;
      s.update(t);
      s.caps.forEach(c => { if (t >= c[0]) cap = [c, s]; });
      s.cite.forEach(c => { if (t >= c[0]) cite = c[1]; });
    }
  });
  if (cap) {
    const [c, s] = cap, next = s.caps[s.caps.indexOf(c) + 1], end = next ? next[0] : s.b;
    const p = seg(t, c[0], c[0] + .35) * (1 - seg(t, end - .25, end));
    capKo.textContent = c[1]; capEn.textContent = c[2];
    $("cap").style.opacity = p; $("cap").style.transform = `translateY(${10 * (1 - p)}px)`;
  } else $("cap").style.opacity = 0;
  $("cite").textContent = cite ? "출처 · " + cite : "";
  $("prog").style.width = (100 * t / DURATION) + "%";
}
window.render = render;
window.DURATION = DURATION;
if (!location.search.includes("render")) {
  const t0 = performance.now();
  const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else render(0);
</script>
