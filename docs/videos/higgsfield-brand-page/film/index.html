<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Brand Page Theater</title>
<style>
  :root {
    --bg: #f3e2bd; --panel: #fffaf0; --panel2: #fdf0d5; --line: #2b2320; --text: #2b2320; --muted: #6b5d52;
    --cream: #f2ebe0; --ink: #17140f; --terra: #d4623a; --forest: #1e3a33; --gold: #d98c1f; --sky: #3e8fb8; --pink: #e0607e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Noto Sans CJK KR", system-ui, sans-serif; }
  .serif { font-family: "Noto Serif CJK KR", serif; }
  .mono { font-family: "DejaVu Sans Mono", monospace; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: var(--bg); }
  .scene { position: absolute; inset: 0; opacity: 0; display: none; }
  .abs { position: absolute; }
  .chap { position: absolute; left: 96px; top: 64px; }
  .chap .k { font-size: 20px; letter-spacing: 5px; color: var(--gold); }
  .chap .t { font-size: 46px; font-weight: 800; margin-top: 4px; }
  .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 260px;
    background: none; }
  #cap { position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; z-index: 50; }
  #cap .ko { font-size: 42px; font-weight: 700; letter-spacing: -.5px; }
  #cap .en { font-size: 22px; color: var(--muted); margin-top: 8px; }
  #cite { position: absolute; right: 40px; bottom: 16px; font-size: 16px; color: #77736b; z-index: 50; }
  .win { position: absolute; background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 50px rgba(120,70,30,.25); }
  .bar { height: 44px; background: #ffe1a6; display: flex; align-items: center; gap: 9px; padding: 0 18px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .addr { margin-left: 14px; flex: 1; height: 28px; border-radius: 8px; background: #fffaf0; color: #2b2320;
    font-size: 16px; display: flex; align-items: center; padding: 0 14px; }
  .view { position: relative; overflow: hidden; background: var(--cream); }
  .page { position: absolute; left: 0; top: 0; width: 1440px; transform-origin: 0 0; background: var(--cream); color: var(--ink); }
  .film { position: absolute; inset: 0; overflow: hidden; }
  .film svg { width: 100%; height: 100%; display: block; }
  .card { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .chip { display: inline-block; padding: 8px 16px; border-radius: 999px; border: 2px solid var(--line); font-size: 20px; }
  .btn { display: inline-grid; place-items: center; padding: 12px 22px; border-radius: 999px; font-weight: 800; font-size: 18px; }
  .bubble { position: absolute; background: #fff; color: var(--ink); border-radius: 22px; padding: 16px 22px; font-size: 26px;
    font-weight: 700; white-space: nowrap; z-index: 40; }
  .bubble::after { content: ""; position: absolute; left: 34px; bottom: -14px; border: 14px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .noa { position: absolute; left: 0; top: 0; z-index: 30; }
  .reftag { position: absolute; padding: 8px 16px; border-radius: 10px; background: var(--gold); color: #1a1406; font-weight: 800; font-size: 20px; letter-spacing: 1px; z-index: 5; }
  .stat { font-size: 64px; font-weight: 900; color: var(--gold); line-height: 1; }
  .progress { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--gold); z-index: 60; }

  /* ===== Stage theme: bright watercolor paper, ink lines, puppet theater ===== */
  @font-face { font-family: "GaeguKo"; src: url(../fonts/gaegu-korean-400-normal.woff2) format("woff2"); font-weight: 400; size-adjust: 120%; }
  @font-face { font-family: "GaeguKo"; src: url(../fonts/gaegu-korean-700-normal.woff2) format("woff2"); font-weight: 700 900; size-adjust: 120%; }
  @font-face { font-family: "GaeguLat"; src: url(../fonts/gaegu-latin-400-normal.woff2) format("woff2"); font-weight: 400; size-adjust: 120%; }
  @font-face { font-family: "GaeguLat"; src: url(../fonts/gaegu-latin-700-normal.woff2) format("woff2"); font-weight: 700 900; size-adjust: 120%; }
  html, body { font-family: "GaeguLat", "GaeguKo", "Noto Sans CJK KR", sans-serif; font-weight: 700; background: #fdf3dc; }
  #stage { background: #fdf3dc; }
  #cam { position: absolute; inset: 0; transform-origin: 960px 470px; }
  #backdrop { position: absolute; inset: 0; background: url(assets/backdrop.jpg) center / cover; }
  #spot { position: absolute; left: 0; top: 0; width: 1400px; height: 1100px; margin: -550px 0 0 -700px; z-index: 1;
    background: radial-gradient(closest-side, rgba(255,252,232,.78), rgba(255,246,205,.45) 45%, rgba(255,240,190,0)); }
  #scenes { position: absolute; inset: 0; z-index: 2; transform-origin: 960px 320px; transform: scale(.82); }
  .scrim { display: none; }
  .chap { background: #fff3cf; border: 3.5px solid #2b2320; border-radius: 10px 16px 12px 14px; padding: 12px 28px 14px;
    box-shadow: 6px 7px 0 rgba(120,70,30,.2); transform: rotate(-1.5deg); }
  .chap::before, .chap::after { content: ""; position: absolute; top: -14px; width: 74px; height: 26px; background: rgba(160,215,240,.75);
    border: 2px solid rgba(43,35,32,.25); }
  .chap::before { left: 18px; transform: rotate(-6deg); } .chap::after { right: 18px; transform: rotate(5deg); background: rgba(255,190,205,.75); }
  .chap .k { color: #d63a2f; letter-spacing: 6px; } .chap .t { font-size: 52px; line-height: 1.05; }
  .card { border: 3.5px solid #2b2320; box-shadow: 7px 8px 0 rgba(120,70,30,.2); }
  .win { border: 3.5px solid #2b2320; box-shadow: 10px 12px 0 rgba(120,70,30,.22); }
  .bar { background: #ffe1a6; border-bottom: 3px solid #2b2320; }
  .addr { background: #fffaf0; color: #2b2320; border: 2px solid #2b2320; }
  .chip { border: 3px solid #2b2320; background: #fffaf0; box-shadow: 3px 4px 0 rgba(120,70,30,.18); }
  .stat { color: #d63a2f; text-shadow: 3px 3px 0 #ffe08a; }
  .reftag { border: 3px solid #2b2320; background: #ffe07a; color: #2b2320; box-shadow: 3px 4px 0 rgba(120,70,30,.2); }
  .bubble { background: #fffdf7; border: 4px solid #2b2320; border-radius: 26px; font-size: 32px; padding: 12px 24px 14px; line-height: 1.15;
    box-shadow: 6px 7px 0 rgba(120,70,30,.22); }
  .bubble::before { content: ""; position: absolute; left: 28px; bottom: -22px; border: 19px solid transparent; border-bottom: 0; border-top-color: #2b2320; }
  .bubble::after { left: 32px; bottom: -15px; border-width: 15px; border-top-color: #fffdf7; }
  .progress { display: none; }
  #floor { position: absolute; left: 0; right: 0; bottom: 0; height: 190px; z-index: 1; }
  #floor svg, #valance svg { position: absolute; left: 0; top: 0; }
  #pool { position: absolute; left: 0; top: 0; width: 1000px; height: 170px; margin: -85px 0 0 -500px; z-index: 1;
    background: radial-gradient(closest-side, rgba(255,250,220,.7), rgba(255,240,190,.35) 55%, rgba(255,240,190,0)); }
  #dust { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  #curt { position: absolute; left: 0; top: 0; z-index: 40; }
  #valance { position: absolute; left: 0; top: 0; width: 1920px; height: 90px; z-index: 41; }
  #extras { position: absolute; inset: 0; z-index: 42; pointer-events: none; }
  #confetti { position: absolute; left: 0; top: 0; z-index: 43; pointer-events: none; }
  #grain { display: none; } /* paper grain is baked into assets/backdrop.jpg (a full-frame overlay costs ~30 ms/frame) */
  #sign { position: absolute; left: 960px; top: -40px; z-index: 43; transform-origin: 0 0; width: 0; height: 0; }
  #sign .rope { position: absolute; top: 0; width: 7px; height: 380px; background: repeating-linear-gradient(160deg, #c8964f 0 6px, #f2cf8a 6px 11px);
    border: 2px solid #2b2320; border-top: 0; }
  #sign .board { position: absolute; top: 370px; left: 0; transform: translateX(-50%); background: #fff3cf; border: 5px solid #2b2320;
    border-radius: 18px 22px 16px 20px; padding: 20px 56px 22px; text-align: center; white-space: nowrap;
    box-shadow: 9px 11px 0 rgba(90,40,20,.3), inset 0 0 0 8px #ffe3a0, inset 0 0 0 11px #2b2320; }
  #sign .nail { position: absolute; top: 12px; width: 14px; height: 14px; border-radius: 50%; background: #f7c948; border: 3px solid #2b2320; }
  #sign .k { font-size: 28px; color: #d63a2f; letter-spacing: 6px; } #sign .t { font-size: 70px; color: #2b2320; line-height: 1.05; margin-top: 2px; }
  #sign .e { font-size: 30px; color: #6b5a4a; margin-top: 4px; font-family: "GaeguLat", "GaeguKo", sans-serif; }
  /* bilingual caption: English (spoken) on top, Korean below */
  #cap { position: absolute; left: 0; right: 0; bottom: 22px; z-index: 50; display: flex; justify-content: center; pointer-events: none; }
  #cap .box { max-width: 1500px; background: #2f4a70; border: 4px solid #2b2320; border-radius: 22px 26px 20px 24px; padding: 12px 40px 14px;
    box-shadow: 6px 7px 0 rgba(60,30,15,.35); text-align: center; position: relative; transform-origin: 50% 100%; }
  #cap .box::before { content: ""; position: absolute; inset: 6px; border: 2px dashed rgba(255,244,214,.38); border-radius: 16px; pointer-events: none; }
  #cap .en { font-size: 42px; line-height: 1.12; color: #fffaf0; letter-spacing: .2px; text-wrap: balance; font-family: "GaeguLat", "GaeguKo", sans-serif; }
  #cap .ko { font-size: 34px; line-height: 1.15; color: #ffd966; margin-top: 3px; text-wrap: balance; font-family: "GaeguKo", "GaeguLat", sans-serif; }
  #cite { position: absolute; right: 196px; top: 78px; bottom: auto; z-index: 45; font-size: 18px; color: #5d4a3c; background: rgba(255,250,236,.9);
    border: 2px solid rgba(43,35,32,.5); border-radius: 10px; padding: 3px 12px 4px; }
  #cite:empty { display: none; }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute"><defs id="fx"></defs></svg>
  <div id="cam">
    <div id="backdrop"></div>
    <div id="spot"></div>
    <div id="floor"></div>
    <div id="pool"></div>
    <div id="scenes"></div>
    <svg id="dust" width="1920" height="1080"></svg>
    <svg id="curt" width="1920" height="1080"></svg>
    <div id="valance"></div>
    <div id="extras"></div>
    <div id="sign"><div class="rope" style="left:-190px"></div><div class="rope" style="left:183px"></div>
      <div class="board"><div class="nail" style="left:22px"></div><div class="nail" style="right:22px"></div><div class="k"></div><div class="t"></div><div class="e"></div></div></div>
    <svg id="confetti" width="1920" height="1080"></svg>
  </div>
  <div id="grain"></div>
  <div id="cap"><div class="box"><div class="en"></div><div class="ko"></div></div></div>
  <div id="cite"></div>
  <div class="progress" id="prog"></div>
</div>

<script src="core.js"></script>
<script src="chapters/ch00.js"></script>
<script src="chapters/ch01.js"></script>
<script src="chapters/ch02.js"></script>
<script src="chapters/ch03.js"></script>
<script src="chapters/ch04.js"></script>
<script src="chapters/ch05.js"></script>
<script src="chapters/ch06.js"></script>
<script src="chapters/ch07.js"></script>
<script src="captions.js"></script>
<script src="boot.js"></script>

</body>
</html>
